[pytest]
; E2E 测试配置
; 参考 AutoCLI 的 CI/CD 集成模式 —— 输出 JSON + HTML 报告

testpaths = tests/e2e

; Markers（注册在 conftest.py 中，这里做文档说明）
; e2e:        所有 E2E 测试
; smoke:      冒烟测试（关键路径）
; visual:     视觉回归测试
; performance: 性能基准测试
; a11y:       无障碍测试

; 超时配置（需要 pytest-timeout 插件）
; timeout = 30    (功能测试)
; timeout = 120   (性能测试)

; 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

; 忽略目录
norecursedirs = baselines reports __pycache__ .git node_modules
